services:
  - type: web
    name: tastebridge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_MODE
        value: live
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_TRUSTED_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_MODE
        value: "on"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        sync: openai/gpt-oss-20b
